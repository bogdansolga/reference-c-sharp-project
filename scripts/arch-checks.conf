# Architecture Checks Configuration — C# port
# Mirrors the TS reference-typescript-project/scripts/arch-checks.conf, retargeted to
# .cs files and `using`-namespace imports. Patterns are regex for grep -E.

# =============================================================================
# check-architecture.sh - Layer hierarchy enforcement
# =============================================================================

# File patterns (which files belong to which layer)
PAGE_PATTERN='web/src/app/.*page\.tsx$'
ROUTE_PATTERN='api/Endpoints/.*\.cs$'
SERVICE_PATTERN='api/Services/.*Service\.cs$'

# Forbidden imports per layer (space-separated list of single-token grep -E patterns;
# each token must NOT contain spaces — the checker splits this list on whitespace).
#   Pages (web) may only call the API over HTTP — never import server layers.
PAGE_FORBIDDEN='@/lib/services @/lib/repositories @/lib/db'
#   Endpoints may only call Services — never Repositories or the DbContext/Data layer.
ROUTE_FORBIDDEN='Api\.Repositories Api\.Data'
#   Services may only call Repositories — never the DbContext/Data layer directly.
SERVICE_FORBIDDEN='Api\.Data'

# =============================================================================
# check-validators.sh - Validator location enforcement (TS: check-schemas.sh)
# =============================================================================

# Where validators should live (for error messages)
SCHEMA_LOCATION='api/Validation/'

# Layers that must not define validators inline (they should inject IValidator<T>)
SCHEMA_CHECK_ROUTES='api/Endpoints'
SCHEMA_CHECK_SERVICES='api/Services'

# =============================================================================
# check-deep-architecture.sh - Advanced checks
# =============================================================================

# Repository layer path
REPO_LAYER_PATH='api/Repositories'

# HTTP/ASP.NET namespaces a pure repository must not import
HTTP_MODULE_PATH='Microsoft.AspNetCore'
HTTP_MODULE_PATH_2='Api.Http'

# Endpoints path for pattern checks
ROUTES_PATH='api/Endpoints'

# Endpoints should rely on centralized middleware, not raw try/catch
TRYCATCH_PATTERN='try'

# Services path for the domain-error check
SERVICES_PATH='api/Services'

# Generic exception the services must not throw (use domain exceptions instead)
GENERIC_THROW='throw new Exception('

# Repository namespace endpoints must not import (use services)
REPO_IMPORT_PATTERN='using Api.Repositories'
